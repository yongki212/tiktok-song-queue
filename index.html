<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Antrean Lagu</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: white;
  margin: 0;
  padding: 30px;
}
h1 {
  color: #555;
}
.song {
  background: #9fb2c0;
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  font-size: 24px;
}
.number {
  font-weight: bold;
  margin-right: 15px;
}
</style>
</head>
<body>

<h1>🎵 ANTREAN LAGU</h1>

<div id="queue"></div>

<script>
function getYoutubeId(url) {
  try {
    const u = new URL(url);

    if (u.hostname.includes("youtu.be")) {
      return u.pathname.substring(1);
    }

    if (u.hostname.includes("youtube.com")) {
      return u.searchParams.get("v");
    }
  } catch (e) {}

  return null;
}

function loadPlaylist() {
  fetch("playlist.txt?t=" + Date.now(), {cache: "no-store"})
    .then(response => response.text())
    .then(text => {
      const songs = text.trim().split(/\r?\n/);
      const queue = document.getElementById("queue");

      queue.innerHTML = "";

      songs.forEach((line, index) => {
        const parts = line.split("|");
        const title = parts[0].trim();
        const youtubeUrl = parts[1] ? parts[1].trim() : "";
        const videoId = getYoutubeId(youtubeUrl);

        const item = document.createElement("div");
        item.className = "song";

        let cover = "";

        if (videoId) {
          cover =
            '<img src="https://img.youtube.com/vi/' +
            videoId +
            '/hqdefault.jpg" ' +
            'style="width:70px;height:50px;object-fit:cover;border-radius:8px;margin-right:15px;vertical-align:middle;">';
        }

        item.innerHTML =
          '<span class="number">#' + (index + 1) + '</span>' +
          cover +
          title;

        queue.appendChild(item);
      });
    });
}

loadPlaylist();
setInterval(loadPlaylist, 10000);
</script>

</body>
</html>
