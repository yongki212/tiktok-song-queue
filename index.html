<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Antrean Lagu</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: white;
  margin: 0;
  padding: 30px;
}
h1 {
  color: #555;
}
.song {
  background: #9fb2c0;
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  font-size: 24px;
}
.number {
  font-weight: bold;
  margin-right: 15px;
}
</style>
</head>
<body>

<h1>🎵 ANTREAN LAGU</h1>

<div id="queue"></div>

<script>
fetch("playlist.txt")
  .then(response => response.text())
  .then(text => {
    const songs = text.trim().split(/\r?\n/);
    const queue = document.getElementById("queue");

    songs.forEach((song, index) => {
      const item = document.createElement("div");
      item.className = "song";
      item.innerHTML =
        '<span class="number">#' + (index + 1) + '</span>' +
        song;
      queue.appendChild(item);
    });
  });
</script>

</body>
</html>
