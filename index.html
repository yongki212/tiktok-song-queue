<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Song Queue</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    color: white;
}

.queue {
    position: absolute;
    left: 40px;
    bottom: 80px;
    width: 600px;
}

.title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 15px;
    text-shadow: 2px 2px 5px #000;
}

.song {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.55);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
}

.cover {
    width: 70px;
    height: 70px;
    border-radius: 8px;
    object-fit: cover;
    margin-right: 14px;
}

.number {
    width: 35px;
    font-size: 22px;
    font-weight: bold;
}

.info {
    flex: 1;
}

.name {
    font-size: 20px;
    font-weight: bold;
}

.artist {
    margin-top: 5px;
    font-size: 15px;
    opacity: 0.75;
}

.time {
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="queue">

    <div class="title">🎵 ANTREAN LAGU</div>

    <div class="song">
        <div class="number">#1</div>
        <img class="cover"
        src="https://i.ytimg.com/vi/VDF131unffA/hqdefault.jpg">

        <div class="info">
            <div class="name">Lagu Pertama</div>
            <div class="artist">@RequestUser</div>
        </div>

        <div class="time">03:25</div>
    </div>

    <div class="song">
        <div class="number">#2</div>
        <img class="cover"
        src="https://i.ytimg.com/vi/VDF131unffA/hqdefault.jpg">

        <div class="info">
            <div class="name">Lagu Kedua</div>
            <div class="artist">@User2</div>
        </div>

        <div class="time">04:10</div>
    </div>

    <div class="song">
        <div class="number">#3</div>
        <img class="cover"
        src="https://i.ytimg.com/vi/VDF131unffA/hqdefault.jpg">

        <div class="info">
            <div class="name">Lagu Ketiga</div>
            <div class="artist">@User3</div>
        </div>

        <div class="time">03:45</div>
    </div>

</div>

</body>
</html>
